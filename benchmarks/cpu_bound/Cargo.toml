[package]
name = "cpu-bound"
version = "0.1.0"
edition = "2021"

[dependencies]
# orengine = "0.7.0-alpha.0" // TODO
memory-stats = "1.0.0"
orengine = { path = "../../../orengine-rs" }
tokio = { version = "1.45.1", features = ["full"] }
smol = "2.0.0"
async-std = "1.13.0"

[[bin]]
name = "orengine"
path = "src/orengine.rs"
doc = false

[[bin]]
name = "tokio"
path = "src/tokio.rs"
doc = false

[profile.release-with-debug]
inherits = "release"
debug = true